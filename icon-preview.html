<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Icon Preview</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #161616;
      color: #f5f5f5;
      font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 18px;
      max-width: 960px;
    }
    .item {
      display: grid;
      gap: 10px;
      justify-items: center;
      padding: 16px;
      background: #242424;
      border: 1px solid #333;
      border-radius: 8px;
    }
    img {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }
    span {
      color: #cfcfcf;
      text-align: center;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/musicIcon.svg" alt=""><span>music</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/musicIconMuted.svg" alt=""><span>circle-off</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/streamIcon.svg" alt=""><span>stream</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/streamIconMuted.svg" alt=""><span>circle-off</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/micIcon.svg" alt=""><span>mic</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/micIconMuted.svg" alt=""><span>circle-off</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/micVocalIcon.svg" alt=""><span>mic-vocal</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/monitorIcon.svg" alt=""><span>headphones</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/monitorIconMuted.svg" alt=""><span>circle-off</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/audioLinesIcon.svg" alt=""><span>audio-lines</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/volumeIcon.svg" alt=""><span>volume</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/sparklesIcon.svg" alt=""><span>sparkles</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/common/slidersIcon.svg" alt=""><span>sliders</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/effectOn.svg" alt=""><span>effect on</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/effectOff.svg" alt=""><span>effect off</span></div>
    <div class="item"><img src="com.romain.livemixer.sdPlugin/imgs/action-icon.svg" alt=""><span>action</span></div>
  </div>
</body>
</html>
