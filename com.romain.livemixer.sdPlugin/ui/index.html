<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Mic Control</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #ccc;
      background: transparent;
      margin: 0;
      padding: 16px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      color: #999;
    }
    .row {
      margin-bottom: 16px;
    }
    select {
      width: 100%;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 13px;
      cursor: pointer;
    }
    select:focus {
      outline: none;
      border-color: #666;
    }
  </style>
</head>
<body>
  <div class="row">
    <label>Step size (% per tick)</label>
    <select id="stepSize">
      <option value="0.01">1%</option>
      <option value="0.02" selected>2%</option>
      <option value="0.03">3%</option>
      <option value="0.04">4%</option>
      <option value="0.05">5%</option>
    </select>
  </div>

  <div class="row">
    <label>Reaper track number</label>
    <select id="trackNumber">
      <option value="1" selected>Track 1</option>
      <option value="2">Track 2</option>
      <option value="3">Track 3</option>
      <option value="4">Track 4</option>
      <option value="5">Track 5</option>
      <option value="6">Track 6</option>
      <option value="7">Track 7</option>
      <option value="8">Track 8</option>
    </select>
  </div>

  <script>
    const connectElgatoStreamDeckSocket = (port, uuid, event, info) => {
      const ws = new WebSocket(`ws://127.0.0.1:${port}`);

      let settings = {};

      ws.onopen = () => {
        ws.send(JSON.stringify({ event, uuid }));
        ws.send(JSON.stringify({ event: 'getSettings', context: uuid }));
      };

      ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.event === 'didReceiveSettings') {
          settings = data.payload.settings || {};
          if (settings.stepSize) document.getElementById('stepSize').value = settings.stepSize;
          if (settings.trackNumber) document.getElementById('trackNumber').value = settings.trackNumber;
        }
      };

      const save = () => {
        settings.stepSize = parseFloat(document.getElementById('stepSize').value);
        settings.trackNumber = parseInt(document.getElementById('trackNumber').value);
        ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings }));
      };

      document.getElementById('stepSize').addEventListener('change', save);
      document.getElementById('trackNumber').addEventListener('change', save);
    };
  </script>
</body>
</html>
