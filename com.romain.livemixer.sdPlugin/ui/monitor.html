<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Monitor Volume Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; font-size: 13px; color: #ccc; background: transparent; margin: 0; padding: 16px; }
    label { display: block; margin-bottom: 4px; color: #999; }
    .row { margin-bottom: 16px; }
    select { width: 100%; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 6px 8px; font-size: 13px; }
    h3 { color: #fff; margin: 0 0 16px 0; font-size: 14px; }
  </style>
</head>
<body>
  <h3>🎧 Monitor Volume</h3>
  <div class="row">
    <label>Step size (% per tick)</label>
    <select id="stepSize">
      <option value="0.01">1%</option>
      <option value="0.02" selected>2%</option>
      <option value="0.03">3%</option>
      <option value="0.05">5%</option>
    </select>
  </div>
  <div class="row">
    <label>Wave Link output name filter (optional)</label>
    <select id="outputName">
      <option value="">First output (auto)</option>
      <option value="analogue">Analogue</option>
      <option value="personal">Personal Mix</option>
    </select>
  </div>
  <script>
    const connectElgatoStreamDeckSocket = (port, uuid, event, info) => {
      const ws = new WebSocket(`ws://127.0.0.1:${port}`);
      let settings = {};
      ws.onopen = () => {
        ws.send(JSON.stringify({ event, uuid }));
        ws.send(JSON.stringify({ event: 'getSettings', context: uuid }));
      };
      ws.onmessage = (msg) => {
        const d = JSON.parse(msg.data);
        if (d.event === 'didReceiveSettings') {
          settings = d.payload.settings || {};
          if (settings.stepSize) document.getElementById('stepSize').value = settings.stepSize;
          if (settings.outputName !== undefined) document.getElementById('outputName').value = settings.outputName;
        }
      };
      const save = () => {
        settings.stepSize = document.getElementById('stepSize').value;
        settings.outputName = document.getElementById('outputName').value;
        ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings }));
      };
      document.getElementById('stepSize').addEventListener('change', save);
      document.getElementById('outputName').addEventListener('change', save);
    };
  </script>
</body>
</html>
